
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.app { padding: 1rem 0; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
.title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.round-info { display: flex; gap: 8px; align-items: center; }
.round-info input { font-size: 13px; padding: 4px 8px; width: 130px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); }
.scores-bar { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 1.5rem; }
.team-score { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.team-score.left { border-left: 3px solid #378ADD; }
.team-score.right { border-left: 3px solid #D85A30; text-align: right; border-left: none; border-right: 3px solid #D85A30; }
.team-name { font-size: 13px; color: var(--color-text-secondary); }
.team-points { font-size: 28px; font-weight: 500; color: var(--color-text-primary); }
.vs-badge { font-size: 14px; font-weight: 500; color: var(--color-text-secondary); text-align: center; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { border: 0.5px solid var(--color-border-tertiary); padding: 8px 6px; text-align: center; color: var(--color-text-primary); }
th { background: var(--color-background-secondary); font-weight: 500; font-size: 12px; }
th.section { background: var(--color-background-tertiary); font-size: 11px; color: var(--color-text-secondary); }
td.q-label { font-weight: 500; color: var(--color-text-secondary); text-align: left; padding-left: 10px; min-width: 60px; }
.btn-group { display: flex; gap: 4px; justify-content: center; }
.mark-btn { font-size: 11px; padding: 3px 8px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); cursor: pointer; background: var(--color-background-primary); color: var(--color-text-secondary); transition: all 0.15s; white-space: nowrap; }
.mark-btn:hover { border-color: var(--color-border-primary); }
.mark-btn.active-correct { background: #E1F5EE; color: #0F6E56; border-color: #5DCAA5; }
.mark-btn.active-wrong { background: #FCEBEB; color: #A32D2D; border-color: #F09595; }
.mark-btn.active-pass { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
.score-cell { font-size: 13px; font-weight: 500; }
.score-pos { color: #0F6E56; }
.score-neg { color: #A32D2D; }
.score-zero { color: var(--color-text-secondary); }
.footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
.reset-btn { font-size: 13px; padding: 6px 14px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); cursor: pointer; background: var(--color-background-primary); color: var(--color-text-secondary); }
.reset-btn:hover { background: var(--color-background-secondary); }
.log-section { margin-top: 1.5rem; }
.log-title { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 8px; }
.log-list { list-style: none; font-size: 12px; max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.log-item { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 4px 10px; color: var(--color-text-secondary); }
.log-item span { font-weight: 500; color: var(--color-text-primary); }
</style>

<div class="app">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Quiz competition scoresheet</h2>

  <div class="header">
    <div class="title">কুইজ অনুচিত্রণ</div>
    <div class="round-info">
      <input id="roundInput" placeholder="রাউন্ড নং" />
      <input id="team1Input" placeholder="টিম ১ নাম" />
      <input id="team2Input" placeholder="টিম ২ নাম" />
    </div>
  </div>

  <div class="scores-bar">
    <div class="team-score left">
      <div class="team-name" id="t1Name">টিম ১</div>
      <div class="team-points" id="t1Score">0</div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="team-score right">
      <div class="team-name" id="t2Name">টিম ২</div>
      <div class="team-points" id="t2Score">0</div>
    </div>
  </div>

  <div class="table-wrap">
    <table id="scoreTable">
      <thead>
        <tr>
          <th rowspan="2">প্রশ্ন</th>
          <th rowspan="2">দলের</th>
          <th colspan="2" class="section">অপশন ছাড়া (+৫/−১)</th>
          <th colspan="2" class="section">অপশন সহ (+৩/−২)</th>
          <th class="section">পাস (০)</th>
          <th colspan="2" class="section">চ্যালেঞ্জ বিপক্ষ (+৪/−৫)</th>
          <th rowspan="2">অর্জিত</th>
        </tr>
        <tr>
          <th>সঠিক</th><th>ভুল</th>
          <th>সঠিক</th><th>ভুল</th>
          <th>পাস</th>
          <th>সঠিক</th><th>ভুল</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer">
    <button class="reset-btn" onclick="resetAll()"><i class="ti ti-refresh" aria-hidden="true"></i> রিসেট</button>
  </div>

  <div class="log-section">
    <div class="log-title">লগ</div>
    <ul class="log-list" id="logList"></ul>
  </div>
</div>

<script>
const MARKS = {
  noOption: { correct: 5, wrong: -1 },
  withOption: { correct: 3, wrong: -2 },
  pass: 0,
  challenge: { correct: 4, wrong: -5 }
};

const QUESTIONS = ['প্রশ্ন ১','প্রশ্ন ২','প্রশ্ন ৩','প্রশ্ন ৪','প্রশ্ন ৫','প্রশ্ন ৬','প্রশ্ন ৭','প্রশ্ন ৮','প্রশ্ন ৯','প্রশ্ন ১০','এক্সট্রা'];

let state = {};
let log = [];

function initState() {
  state = {};
  QUESTIONS.forEach((q, qi) => {
    ['t1','t2'].forEach(t => {
      state[qi+'_'+t] = { type: null, result: null, marks: 0 };
    });
  });
  log = [];
}

function getTeamName(t) {
  const el = document.getElementById(t === 't1' ? 'team1Input' : 'team2Input');
  return el && el.value.trim() ? el.value.trim() : (t === 't1' ? 'টিম ১' : 'টিম ২');
}

function calcMarks(type, result) {
  if (!type || !result) return 0;
  if (type === 'noOption') return result === 'correct' ? MARKS.noOption.correct : MARKS.noOption.wrong;
  if (type === 'withOption') return result === 'correct' ? MARKS.withOption.correct : MARKS.withOption.wrong;
  if (type === 'pass') return 0;
  if (type === 'challenge') return result === 'correct' ? MARKS.challenge.correct : MARKS.challenge.wrong;
  return 0;
}

function setMark(qi, team, type, result) {
  const key = qi+'_'+team;
  const prev = {...state[key]};
  state[key] = { type, result, marks: calcMarks(type, result) };
  updateScores();
  renderRow(qi);
  const tName = getTeamName(team);
  const qLabel = QUESTIONS[qi];
  const typeLabel = { noOption: 'অপশন ছাড়া', withOption: 'অপশন সহ', pass: 'পাস', challenge: 'চ্যালেঞ্জ' }[type];
  const resultLabel = result === 'correct' ? '✓ সঠিক' : (result === 'wrong' ? '✗ ভুল' : 'পাস');
  const m = state[key].marks;
  log.unshift(`${qLabel} — ${tName} — ${typeLabel} — ${resultLabel} — ${m > 0 ? '+' : ''}${m}`);
  if (log.length > 30) log.pop();
  renderLog();
}

function updateScores() {
  let t1 = 0, t2 = 0;
  QUESTIONS.forEach((_, qi) => {
    t1 += state[qi+'_t1'].marks;
    t2 += state[qi+'_t2'].marks;
  });
  document.getElementById('t1Score').textContent = t1;
  document.getElementById('t2Score').textContent = t2;
  document.getElementById('t1Name').textContent = getTeamName('t1');
  document.getElementById('t2Name').textContent = getTeamName('t2');
}

function scoreClass(m) {
  if (m > 0) return 'score-pos';
  if (m < 0) return 'score-neg';
  return 'score-zero';
}

function btn(qi, team, type, result, label) {
  const s = state[qi+'_'+team];
  const isActive = s.type === type && s.result === result;
  const cls = isActive ? (result === 'correct' ? 'active-correct' : result === 'wrong' ? 'active-wrong' : 'active-pass') : '';
  return `<button class="mark-btn ${cls}" onclick="setMark(${qi},'${team}','${type}','${result}')">${label}</button>`;
}

function renderRow(qi) {
  const row = document.getElementById('row_'+qi);
  if (!row) return;
  ['t1','t2'].forEach((t, ti) => {
    const s = state[qi+'_'+t];
    const m = s.marks;
    const scoreHtml = s.type ? `<span class="${scoreClass(m)}">${m > 0 ? '+' : ''}${m}</span>` : '<span class="score-zero">—</span>';

    row.cells[ti === 0 ? 2 : 11].innerHTML = `<div class="btn-group">${btn(qi,t,'noOption','correct','✓')}${btn(qi,t,'noOption','wrong','✗')}</div>`;
    row.cells[ti === 0 ? 3 : 12].innerHTML = '';
    row.cells[ti === 0 ? 4 : 13].innerHTML = `<div class="btn-group">${btn(qi,t,'withOption','correct','✓')}${btn(qi,t,'withOption','wrong','✗')}</div>`;
    row.cells[ti === 0 ? 5 : 14].innerHTML = '';
    row.cells[ti === 0 ? 6 : 15].innerHTML = `<div class="btn-group">${btn(qi,t,'pass','pass','পাস')}</div>`;
    row.cells[ti === 0 ? 7 : 16].innerHTML = `<div class="btn-group">${btn(qi,t,'challenge','correct','✓')}${btn(qi,t,'challenge','wrong','✗')}</div>`;
    row.cells[ti === 0 ? 8 : 17].innerHTML = '';
    row.cells[ti === 0 ? 9 : 18].innerHTML = `<div class="score-cell">${scoreHtml}</div>`;
  });
}

function buildTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  QUESTIONS.forEach((q, qi) => {
    const tr = document.createElement('tr');
    tr.id = 'row_'+qi;
    tr.innerHTML = `
      <td class="q-label" rowspan="1">${q}</td>
      <td style="font-size:11px;color:var(--color-text-secondary);white-space:nowrap">${getTeamName('t1')}</td>
      <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
      <td></td>
      <td style="font-size:11px;color:var(--color-text-secondary);white-space:nowrap">${getTeamName('t2')}</td>
      <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
      <td></td>`;
    tbody.appendChild(tr);
    renderRow(qi);
  });
}

function renderLog() {
  const ul = document.getElementById('logList');
  ul.innerHTML = log.map(l => `<li class="log-item">${l}</li>`).join('');
}

function resetAll() {
  if (!confirm('সব স্কোর রিসেট করবেন?')) return;
  initState();
  buildTable();
  updateScores();
  renderLog();
}

['team1Input','team2Input'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    updateScores();
    buildTable();
  });
});

initState();
buildTable();
updateScores();
</script>
